<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spacer Ranking - Standoff 2</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #0f1115; --panel: #1a1d24; --text: #ffffff; --muted: #8b8e96;
            --accent: #3b82f6; --green: #10b981; --red: #ef4444;
            --gold: #fbbf24; --silver: #9ca3af; --bronze: #b45309;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text); padding-bottom: 90px; overflow-x: hidden; }

        .page { display: none; padding: 20px; }
        .page.active { display: block; }
        
        /* Формы */
        .box { background: var(--panel); padding: 20px; border-radius: 12px; max-width: 400px; margin: 20px auto; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; background: #2a2e37; border: 1px solid #444; border-radius: 8px; color: #fff; }
        button { width: 100%; padding: 12px; margin-top: 10px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        button:disabled { background: #444; }
        button.sec { background: transparent; border: 1px solid #444; }
        button.danger { background: var(--red); }
        .err { color: var(--red); font-size: 14px; margin-bottom: 10px; display: none; text-align: center; font-weight: bold; }

        /* Навигация */
        #nav { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); background: rgba(26,29,36,0.95); display: none; justify-content: space-around; width: 95%; max-width: 500px; padding: 10px; border-radius: 20px; border: 1px solid #2a2e37; z-index: 100; }
        .nav-btn { background: none; color: var(--muted); border: none; font-size: 11px; font-weight: bold; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; width: auto; margin: 0; padding: 5px;}
        .nav-btn.active { color: var(--accent); }
        .icon { font-size: 18px; }

        /* Топ */
        .podium { display: flex; justify-content: center; align-items: flex-end; gap: 10px; height: 180px; margin-top: 20px; }
        .pod { display: flex; flex-direction: column; align-items: center; width: 90px; }
        .pod .av { width: 50px; height: 50px; background: #2a2e37; border-radius: 8px; display: flex; justify-content: center; align-items: center; font-size: 20px; font-weight: bold; border: 2px solid transparent; margin-bottom: 5px; }
        .pod .nm { font-size: 12px; font-weight: bold; text-align: center; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .pod .lvl { font-size: 10px; color: var(--muted); }
        .pod .base { width: 100%; border-radius: 8px 8px 0 0; margin-top: 5px; }
        .p1 .av { border-color: var(--gold); width: 60px; height: 60px; }
        .p1 .base { height: 90px; background: linear-gradient(to top, #1a1d24, var(--gold)); }
        .p2 .av { border-color: var(--silver); }
        .p2 .base { height: 65px; background: linear-gradient(to top, #1a1d24, var(--silver)); }
        .p3 .av { border-color: var(--bronze); }
        .p3 .base { height: 45px; background: linear-gradient(to top, #1a1d24, var(--bronze)); }

        .row { display: flex; align-items: center; background: var(--panel); padding: 12px; border-radius: 12px; margin-bottom: 10px; }
        .row .av-sm { width: 40px; height: 40px; background: #2a2e37; border-radius: 8px; display: flex; justify-content: center; align-items: center; font-weight: bold; margin-right: 12px; }
        .row .info { flex-grow: 1; }
        .row .nm { font-weight: bold; }
        .row .clan { color: var(--green); font-size: 12px; }
        .row .elo { color: var(--accent); font-weight: bold; }

        /* Лобби */
        .lobby-item { display: flex; align-items: center; background: var(--panel); padding: 12px; border-radius: 12px; margin-bottom: 10px; }
        .lobby-item.empty { opacity: 0.5; border: 1px dashed #444; background: transparent; }
        .btn-kick { width: 30px; padding: 5px; margin: 0; background: var(--red); border-radius: 6px; }

        /* Матч */
        .teams { display: flex; gap: 10px; margin-top: 20px; }
        .team { flex: 1; background: var(--panel); padding: 10px; border-radius: 12px; }
        .team h3 { text-align: center; margin-bottom: 10px; color: var(--accent); }
        .team .player { font-size: 12px; padding: 4px 0; border-bottom: 1px solid #333; }
        .maps { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .map { padding: 12px; background: var(--panel); border: 1px solid #444; border-radius: 8px; color: #fff; text-align: center; cursor: pointer; font-weight: bold; }
        .map.banned { opacity: 0.3; text-decoration: line-through; border-color: var(--red); }
        .chat { background: var(--panel); height: 120px; overflow-y: auto; border-radius: 12px; margin-top: 15px; padding: 10px; font-size: 12px; }

        /* Профиль */
        .prof-head { display: flex; gap: 15px; background: var(--panel); padding: 20px; border-radius: 12px; }
        .prof-av { width: 80px; height: 80px; background: #2a2e37; border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 32px; font-weight: bold; border: 2px solid var(--accent); }
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .stat { background: var(--panel); padding: 15px; border-radius: 12px; text-align: center; }
        .stat h3 { color: var(--muted); font-size: 12px; }
        .stat p { font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <!-- 1. ВХОД -->
    <div id="pg-login" class="page active">
        <div class="box">
            <h2 style="text-align:center; margin-bottom:15px;">Вход</h2>
            <div class="err" id="err-login"></div>
            <input type="email" id="l-email" placeholder="Email">
            <input type="password" id="l-pass" placeholder="Пароль">
            <button id="btn-login" onclick="doLogin()">Войти</button>
            <button class="sec" onclick="show('pg-reg')">Регистрация</button>
        </div>
    </div>

    <!-- 2. РЕГИСТРАЦИЯ -->
    <div id="pg-reg" class="page">
        <div class="box">
            <h2 style="text-align:center; margin-bottom:15px;">Регистрация</h2>
            <div class="err" id="err-reg"></div>
            <input type="text" id="r-name" placeholder="Игровой никнейм">
            <input type="email" id="r-email" placeholder="Email">
            <input type="password" id="r-pass" placeholder="Пароль (мин 6 символов)">
            <button id="btn-reg" onclick="doRegister()">Создать аккаунт</button>
            <button class="sec" onclick="show('pg-login')">Назад</button>
        </div>
    </div>

    <!-- 3. ГЛАВНАЯ -->
    <div id="pg-home" class="page">
        <h2>Топ игроков</h2>
        <div class="podium" id="podium"></div>
        <div id="list" style="margin-top:20px;"></div>
    </div>

    <!-- 4. ДРУЗЬЯ -->
    <div id="pg-friends" class="page">
        <h2>Друзья</h2>
        <input type="text" id="f-input" placeholder="Введите ник или ID друга">
        <button onclick="addFriend()">Добавить в лобби</button>
        <div id="friends-list" style="margin-top:20px;"></div>
    </div>

    <!-- 5. ИГРАТЬ (Лобби) -->
    <div id="pg-play" class="page">
        <h2>Лобби</h2>
        <div id="lobby-list"></div>
        <button id="btn-play" onclick="startMatch()" style="margin-top:20px;">ИГРАТЬ</button>
    </div>

    <!-- 6. МАТЧ -->
    <div id="pg-match" class="page">
        <h2 id="match-status" style="text-align:center;">Поиск матча...</h2>
        <div id="match-content" style="display:none;">
            <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                <span>Счет: 0 : 0</span>
                <span id="m-map" style="color:var(--gold);">Карта: Ожидание</span>
            </div>
            <div class="teams">
                <div class="team"><h3>КТ</h3><div id="team-ct"></div></div>
                <div class="team"><h3>Т</h3><div id="team-t"></div></div>
            </div>
            <h3 style="margin-top:20px; font-size:14px; color:var(--muted);">Бан карт (Чей ход: Ваш)</h3>
            <div class="maps" id="maps"></div>
            <div class="chat" id="chat"></div>
            <input type="text" id="chat-inp" placeholder="Сообщение..." style="margin-top:5px;">
            <button onclick="sendChat()">Отправить в чат</button>
            <button class="danger" style="margin-top:15px;" onclick="cancelMatch()">Отменить матч</button>
        </div>
    </div>

    <!-- 7. ПРОФИЛЬ -->
    <div id="pg-profile" class="page">
        <div class="prof-head">
            <div class="prof-av" id="p-av">A</div>
            <div>
                <h2 id="p-name">...</h2>
                <p style="font-size:12px; color:var(--muted);">ID: <span id="p-id">0</span> | LVL: <span id="p-lvl">1</span></p>
            </div>
        </div>
        <div class="stats">
            <div class="stat"><h3>Победы</h3><p id="p-wins">0</p></div>
            <div class="stat"><h3>Поражения</h3><p id="p-loss">0</p></div>
            <div class="stat"><h3>Winrate</h3><p id="p-wr">0%</p></div>
            <div class="stat"><h3>ELO</h3><p id="p-elo">0</p></div>
        </div>
        <button class="sec" style="margin-top:20px; color:var(--red); border-color:var(--red);" onclick="logout()">Выйти</button>
    </div>

    <!-- НАВИГАЦИЯ -->
    <div id="nav">
        <button class="nav-btn active" onclick="nav('pg-home', this)"><span class="icon">⌂</span>Главная</button>
        <button class="nav-btn" onclick="nav('pg-friends', this)"><span class="icon">👥</span>Друзья</button>
        <button class="nav-btn" onclick="nav('pg-play', this)"><span class="icon">▶</span>Играть</button>
        <button class="nav-btn" onclick="nav('pg-profile', this)"><span class="icon">👤</span>Профиль</button>
    </div>

    <script>
        const db = supabase.createClient('https://gczavlghcxpjouuxalmf.supabase.co', 'sb_publishable_go2KJ6nZ5KdxewNnVCs6kA_qTJMq-rj');
        let user = null, lobby = [], matchChan = null;

        function show(id) {
            document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
            document.getElementById(id).style.display = 'block';
            if (id === 'pg-home') loadTop();
            if (id === 'pg-profile' && user) loadProfile();
            if (id === 'pg-play') renderLobby();
        }
        
        function nav(id, btn) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            show(id);
        }

        // --- 1. РЕГИСТРАЦИЯ ---
        async function doRegister() {
            const btn = document.getElementById('btn-reg');
            const err = document.getElementById('err-reg');
            err.style.display = 'none';

            const name = document.getElementById('r-name').value;
            const email = document.getElementById('r-email').value;
            const pass = document.getElementById('r-pass').value;

            if(!name || !email || !pass) { err.innerText = "Заполните поля"; err.style.display = 'block'; return; }
            
            btn.innerText = "Загрузка..."; btn.disabled = true;

            const { data, error } = await db.auth.signUp({ email, password: pass });
            
            if (error) {
                err.innerText = error.message; err.style.display = 'block';
                btn.innerText = "Создать аккаунт"; btn.disabled = false;
                return;
            }

            if (data.user) {
                const { error: dbErr } = await db.from('players').insert([{
                    username: name, auth_user_id: data.user.id, elo: 1000, level: 1, wins: 0, losses: 0, evo: 0
                }]);
                
                if (dbErr) {
                    err.innerText = "Ошибка БД: " + dbErr.message; err.style.display = 'block';
                    btn.innerText = "Создать аккаунт"; btn.disabled = false;
                } else {
                    initUser(); // Автоматический вход
                }
            }
        }

        // --- 2. ВХОД ---
        async function doLogin() {
            const btn = document.getElementById('btn-login');
            const err = document.getElementById('err-login');
            err.style.display = 'none';

            const email = document.getElementById('l-email').value;
            const pass = document.getElementById('l-pass').value;

            if(!email || !pass) { err.innerText = "Введите данные"; err.style.display = 'block'; return; }

            btn.innerText = "Загрузка..."; btn.disabled = true;

            const { data, error } = await db.auth.signInWithPassword({ email, password: pass });
            
            if (error) {
                err.innerText = "Неверный Email или Пароль"; err.style.display = 'block';
                btn.innerText = "Войти"; btn.disabled = false;
                return;
            }
            initUser();
        }

        async function initUser() {
            const { data: { session } } = await db.auth.getSession();
            if (!session) return;
            
            const { data } = await db.from('players').select('*').eq('auth_user_id', session.user.id).single();
            if (!data) return document.getElementById('err-login').innerText = "Профиль не найден";

            user = data;
            document.getElementById('nav').style.display = 'flex';
            document.getElementById('pg-login').style.display = 'none';
            document.getElementById('pg-reg').style.display = 'none';
            
            nav('pg-home', document.querySelector('.nav-btn'));
            loadProfile();
            renderLobby();
        }

        async function logout() {
            await db.auth.signOut();
            location.reload();
        }

        // --- 3. ГЛАВНАЯ (ТОП) ---
        async function loadTop() {
            const { data } = await db.from('players').select('*').order('elo', { ascending: false }).limit(20);
            const pod = document.getElementById('podium');
            const list = document.getElementById('list');
            pod.innerHTML = ''; list.innerHTML = '';

            if (data && data.length > 0) {
                const p1 = data[0], p2 = data[1] || {username:'---', level:0}, p3 = data[2] || {username:'---', level:0};
                pod.innerHTML = `
                    <div class="pod p2"><div class="av">${p2.username[0]}</div><div class="nm">${p2.username}</div><div class="lvl">LVL ${p2.level}</div><div class="base"></div></div>
                    <div class="pod p1"><div class="av">${p1.username[0]}</div><div class="nm">${p1.username}</div><div class="lvl">LVL ${p1.level} • EVO ${p1.evo}</div><div class="base"></div></div>
                    <div class="pod p3"><div class="av">${p3.username[0]}</div><div class="nm">${p3.username}</div><div class="lvl">LVL ${p3.level}</div><div class="base"></div></div>
                `;
            }
            if (data) {
                data.slice(3).forEach((p, i) => {
                    list.innerHTML += `<div class="row"><div class="av-sm">${p.username[0]}</div><div class="info"><div class="nm">${p.username}</div><div style="font-size:10px; color:var(--muted)">LVL ${p.level}</div></div><div class="elo">${p.elo}</div></div>`;
                });
            }
        }

        // --- 4. ПРОФИЛЬ ---
        function loadProfile() {
            if (!user) return;
            document.getElementById('p-av').innerText = user.username[0];
            document.getElementById('p-name').innerText = user.username;
            document.getElementById('p-id').innerText = user.id;
            document.getElementById('p-lvl').innerText = user.level;
            document.getElementById('p-elo').innerText = user.elo;
            
            const w = user.wins || 0, l = user.losses || 0, t = w + l;
            document.getElementById('p-wins').innerText = w;
            document.getElementById('p-loss').innerText = l;
            document.getElementById('p-wr').innerText = t === 0 ? '0%' : Math.round((w/t)*100) + '%';
        }

        // --- 5. ДРУЗЬЯ И ЛОББИ ---
        async function addFriend() {
            const inp = document.getElementById('f-input').value.trim();
            if (!inp) return;
            if (lobby.length >= 4) return alert("Лобби заполнено (макс 5)");

            const { data } = await db.from('players').select('*').or(`id.eq.${inp},username.eq.${inp}`).single();
            if (!data) return alert("Игрок не найден");
            if (data.id === user.id) return alert("Это вы");
            if (lobby.find(p => p.id === data.id)) return alert("Уже в лобби");

            lobby.push(data);
            document.getElementById('f-input').value = '';
            renderLobby();
            nav('pg-play', document.querySelectorAll('.nav-btn')[2]);
        }

        function renderLobby() {
            const box = document.getElementById('lobby-list');
            if(!box || !user) return;
            box.innerHTML = '';
            
            box.innerHTML += `<div class="lobby-item"><div class="av-sm">${user.username[0]}</div><div style="flex:1; font-weight:bold; margin-left:10px;">${user.username} (Вы)</div></div>`;
            
            lobby.forEach((p, i) => {
                box.innerHTML += `<div class="lobby-item"><div class="av-sm">${p.username[0]}</div><div style="flex:1; font-weight:bold; margin-left:10px;">${p.username}</div><button class="btn-kick" onclick="kick(${i})">X</button></div>`;
            });

            for (let i = lobby.length + 1; i < 5; i++) {
                box.innerHTML += `<div class="lobby-item empty"><div class="av-sm">+</div><div style="color:var(--muted); margin-left:10px;">Свободно</div></div>`;
            }
        }

        function kick(i) { lobby.splice(i, 1); renderLobby(); }

        // --- 6. МАТЧ ---
        function startMatch() {
            document.getElementById('match-status').innerText = "Поиск (Игроков онлайн: 1245)...";
            document.getElementById('match-content').style.display = 'none';
            show('pg-match');

            setTimeout(() => {
                document.getElementById('match-status').innerText = "Подтвердите готовность...";
                setTimeout(() => {
                    document.getElementById('match-status').innerText = "Матч найден!";
                    document.getElementById('match-content').style.display = 'block';
                    renderMatch();
                }, 1500);
            }, 2000);
        }

        function renderMatch() {
            document.getElementById('team-ct').innerHTML = `<div class="player">${user.username} (Вы)</div>` + lobby.map(p => `<div class="player">${p.username}</div>`).join('');
            document.getElementById('team-t').innerHTML = Array(5).fill(0).map((_,i) => `<div class="player">Игрок Т ${i+1}</div>`).join('');
            
            const maps = ['Sandstone', 'Hanami', 'Rust', 'Duna', 'Province', 'Breeze', 'Prison'];
            document.getElementById('maps').innerHTML = maps.map(m => `<button class="map" id="m-${m}" onclick="banMap('${m}')">${m}</button>`).join('');

            matchChan = db.channel('match_' + user.id);
            matchChan.on('broadcast', { event: 'ban' }, p => {
                const b = document.getElementById('m-' + p.payload.map);
                if(b) { b.classList.add('banned'); b.innerText = p.payload.map + ' (БАН)'; }
                addChat(`[Система] ${p.payload.user} забанил ${p.payload.map}`);
            }).on('broadcast', { event: 'chat' }, p => {
                addChat(`<b>${p.payload.user}:</b> ${p.payload.text}`);
            }).subscribe();
        }

        function banMap(map) {
            const btn = document.getElementById('m-' + map);
            if (btn.classList.contains('banned')) return;
            btn.classList.add('banned'); btn.innerText = map + ' (БАН)';
            if (matchChan) matchChan.send({ type: 'broadcast', event: 'ban', payload: { map, user: user.username } });
        }

        function sendChat() {
            const inp = document.getElementById('chat-inp');
            if (!inp.value || !matchChan) return;
            matchChan.send({ type: 'broadcast', event: 'chat', payload: { user: user.username, text: inp.value } });
            addChat(`<b>Вы:</b> ${inp.value}`);
            inp.value = '';
        }

        function addChat(txt) {
            document.getElementById('chat').innerHTML += `<div>${txt}</div>`;
            document.getElementById('chat').scrollTop = 9999;
        }

        function cancelMatch() {
            if (matchChan) db.removeChannel(matchChan);
            nav('pg-play', document.querySelectorAll('.nav-btn')[2]);
        }

        // Проверка при загрузке
        db.auth.onAuthStateChange((e, s) => { if (s && !user) initUser(); });

    </script>
</body>
</html>
